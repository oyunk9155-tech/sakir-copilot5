name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Depo yapısını göster
        run: |
          echo "=== Depo yapısı ==="
          find . -path ./.git -prune -o -type f -print | sort
          echo "=== Kökteki build dosyaları ==="
          ls -la build.gradle* 2>/dev/null || echo "kökte build.gradle yok (doğru)"

      - name: Kökteki fazla build dosyasını temizle ve gerekli dosyaları doğrula
        run: |
          rm -f build.gradle build.gradle.kts
          test -f settings.gradle.kts || { echo "HATA: kökte settings.gradle.kts yok"; exit 1; }
          test -f app/build.gradle.kts || { echo "HATA: app/build.gradle.kts yok"; exit 1; }
          grep -q "android {" app/build.gradle.kts || { echo "HATA: app/build.gradle.kts içinde android bölümü yok"; exit 1; }
          test -f app/src/main/AndroidManifest.xml || { echo "HATA: app/src/main/AndroidManifest.xml yok"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Sakir-APK
          path: app/build/outputs/apk/debug/app-debug.apk
